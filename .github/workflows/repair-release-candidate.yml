name: ALLways Admin Repair Release Candidate

on:
  push:
    branches: [fix/reported-flow-audit-2026-10-10]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/repair-release-candidate.yml"
  workflow_dispatch:

concurrency:
  group: allways-admin-repair-release-candidate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Configure release signing
        shell: bash
        env:
          ALLWAYS_KEYSTORE_BASE64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          ALLWAYS_KEYSTORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          ALLWAYS_KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          printf '%s' "$ALLWAYS_KEYSTORE_BASE64" | base64 --decode > android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$ALLWAYS_KEYSTORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$ALLWAYS_KEYSTORE_PASSWORD
          keyPassword=$ALLWAYS_KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Validate Mapbox public token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN"
          case "$MAPBOX_PUBLIC_TOKEN" in pk.*) echo "Mapbox public token configured." ;; *) echo "MAPBOX_PUBLIC_TOKEN must start with pk."; exit 1 ;; esac

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Enforce 30 MB release APK limit
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Release APK size: $SIZE bytes"
          if [ "$SIZE" -gt 30000000 ]; then
            echo "Release APK exceeds the 30,000,000-byte limit; refusing to publish."
            exit 1
          fi


      - name: Verify final app identity
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "package: name='com.allways.admin'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "application-label:'ALLways Admin'"

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build x86_64 smoke-test APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        shell: bash
        run: flutter build apk --debug --target-platform android-x64 --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb logcat -c
            adb install -r build/app/outputs/flutter-apk/app-debug.apk || (sleep 5 && adb install -r build/app/outputs/flutter-apk/app-debug.apk)
            timeout 90s adb shell am start -W -n com.allways.admin/.MainActivity
            sleep 15
            adb shell pidof com.allways.admin >/dev/null || { echo "Admin process exited after launch; Android diagnostics follow."; adb logcat -d -t 1200 | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.allways.admin|Unable to start activity' || true; adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true; exit 1; }

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-admin-v${{ env.APP_VERSION }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-admin-latest.apk"
      - name: Upload signed release candidate (no GitHub Release publication)
        uses: actions/upload-artifact@v4
        with:
          name: allways-admin-release-candidate
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7
