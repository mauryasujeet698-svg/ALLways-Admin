name: ALLways Admin Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure release signing
        shell: bash
        env:
          ALLWAYS_KEYSTORE_BASE64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          ALLWAYS_KEYSTORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          ALLWAYS_KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          printf '%s' "$ALLWAYS_KEYSTORE_BASE64" | base64 --decode > android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$ALLWAYS_KEYSTORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$ALLWAYS_KEYSTORE_PASSWORD
          keyPassword=$ALLWAYS_KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allways-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android runtime smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            timeout 90s adb shell am start -S -W -n com.allways.admin/.MainActivity
            adb shell pidof com.allways.admin
