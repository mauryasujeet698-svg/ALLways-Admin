name: ALLways Admin Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure release signing
        shell: bash
        env:
          ALLWAYS_KEYSTORE_BASE64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          ALLWAYS_KEYSTORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          ALLWAYS_KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          printf '%s' "$ALLWAYS_KEYSTORE_BASE64" | base64 --decode > android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$ALLWAYS_KEYSTORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$ALLWAYS_KEYSTORE_PASSWORD
          keyPassword=$ALLWAYS_KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Validate Mapbox public token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN"
          case "$MAPBOX_PUBLIC_TOKEN" in pk.*) echo "Mapbox public token configured." ;; *) echo "MAPBOX_PUBLIC_TOKEN must start with pk."; exit 1 ;; esac

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allways-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14


      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-admin-v${APP_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-admin-latest.apk"
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: allways-latest
          name: "ALLways Admin v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            release-assets/allways-admin-v${{ env.APP_VERSION }}.apk
            release-assets/allways-admin-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Android runtime smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            timeout 90s adb shell am start -S -W -n com.allways.admin/.MainActivity
            adb shell pidof com.allways.admin
