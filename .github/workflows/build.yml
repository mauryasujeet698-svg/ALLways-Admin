name: ALLways Admin Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: allways-admin-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Configure release signing
        shell: bash
        env:
          ALLWAYS_KEYSTORE_BASE64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          ALLWAYS_KEYSTORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          ALLWAYS_KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          printf '%s' "$ALLWAYS_KEYSTORE_BASE64" | base64 --decode > android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$ALLWAYS_KEYSTORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$ALLWAYS_KEYSTORE_PASSWORD
          keyPassword=$ALLWAYS_KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Validate Mapbox public token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN"
          case "$MAPBOX_PUBLIC_TOKEN" in pk.*) echo "Mapbox public token configured." ;; *) echo "MAPBOX_PUBLIC_TOKEN must start with pk."; exit 1 ;; esac

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Enforce 35 MB release APK limit
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Release APK size: $SIZE bytes"
          if [ "$SIZE" -gt 35000000 ]; then
            echo "Release APK exceeds the 35,000,000-byte limit; refusing to publish."
            exit 1
          fi


      - name: Verify final app identity
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "package: name='com.allways.admin'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "application-label:'ALLways Admin'"

      - name: Verify signed production APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allways-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1


      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Preserve signed arm64 production APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-admin-v${{ env.APP_VERSION }}.apk"

      - name: Build release-mode x86_64 startup-test APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        shell: bash
        run: flutter build apk --release --target-platform android-x64 --obfuscate --split-debug-info=build/smoke-symbols --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Android release-mode launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb wait-for-device
            ready=0
            for attempt in $(seq 1 90); do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$boot" = "1" ] && adb shell cmd package list packages >/dev/null 2>&1 && adb shell dumpsys activity activities >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo "::error::Android emulator services did not become ready."
              adb logcat -d -t 1500 | tail -n 300 || true
              exit 1
            fi
            adb logcat -c
            APK="build/app/outputs/flutter-apk/app-release.apk"
            installed=0
            for attempt in 1 2 3 4; do
              if adb install -r "$APK"; then installed=1; break; fi
              sleep 5
            done
            if [ "$installed" != "1" ]; then
              echo "::error::Release-mode x86_64 APK could not be installed."
              adb logcat -d -t 1500 | tail -n 300 || true
              exit 1
            fi
            timeout 90s adb shell am start -W -n com.allways.admin/.MainActivity
            sleep 15
            if ! adb shell pidof com.allways.admin >/dev/null; then
              echo "::error::allways-admin process exited after launch."
              adb logcat -d -t 1800 | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.allways.admin|Unable to start activity' || true
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F 'com.allways.admin/.MainActivity' >/dev/null || {
              echo "::error::allways-admin did not remain the resumed activity."
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
              exit 1
            }

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp "release-assets/allways-admin-v${{ env.APP_VERSION }}.apk" "release-assets/allways-admin-latest.apk"
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: allways-latest
          name: "ALLways Admin v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            release-assets/allways-admin-v${{ env.APP_VERSION }}.apk
            release-assets/allways-admin-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

